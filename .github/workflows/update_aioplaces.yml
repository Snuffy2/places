name: Update aioplaces dependency pins

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      aioplaces_release_owner:
        description: Owner for aioplaces releases lookup
        required: false
        default: Snuffy2
      aioplaces_release_repo:
        description: Repository for aioplaces releases lookup
        required: false
        default: aioplaces

concurrency:
  group: update-aioplaces-manifest
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-aioplaces:
    name: Update aioplaces
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Set up uv (with caching)
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.14'
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: uv.lock

      - name: Determine current and latest aioplaces versions
        id: versions
        run: |
          set -euo pipefail

          python .github/scripts/update_aioplaces_pins.py \
            --manifest-path custom_components/places/manifest.json \
            --pyproject-path pyproject.toml \
            --github-output "$GITHUB_OUTPUT"

      - name: Update aioplaces dependency pins
        if: steps.versions.outputs.update_needed == 'true'
        env:
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail

          python .github/scripts/update_aioplaces_pins.py \
            --manifest-path custom_components/places/manifest.json \
            --pyproject-path pyproject.toml \
            --latest-version "$LATEST_VERSION" \
            --write

      - name: Regenerate uv lock
        if: steps.versions.outputs.update_needed == 'true'
        run: uv lock

      - name: Run tests with the updated dependency lock
        if: steps.versions.outputs.update_needed == 'true'
        run: uv run --locked --group pytest pytest

      - name: Build aioplaces release notes
        if: steps.versions.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.versions.outputs.current }}
          PYPROJECT_CURRENT_VERSION: ${{ steps.versions.outputs.pyproject_current }}
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
          REPO_OWNER: ${{ github.event.inputs.aioplaces_release_owner || vars.AIOPLACES_RELEASE_OWNER || 'Snuffy2' }}
          REPO_NAME: ${{ github.event.inputs.aioplaces_release_repo || vars.AIOPLACES_RELEASE_REPO || 'aioplaces' }}
        run: |
          set -euo pipefail

          python .github/scripts/build_aioplaces_release_notes.py \
            --current-version "$CURRENT_VERSION" \
            --pyproject-current-version "$PYPROJECT_CURRENT_VERSION" \
            --latest-version "$LATEST_VERSION" \
            --release-owner "$REPO_OWNER" \
            --release-repo "$REPO_NAME" \
            --body-path aioplaces-update-pr-body.md

      - name: Create or update aioplaces update PR
        if: steps.versions.outputs.update_needed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-aioplaces-manifest
          delete-branch: true
          commit-message: 'deps(aioplaces): bump to ${{ steps.versions.outputs.latest }}'
          title: 'deps(aioplaces): bump to ${{ steps.versions.outputs.latest }}'
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          labels: dependencies
          body-path: aioplaces-update-pr-body.md
          add-paths: |
            custom_components/places/manifest.json
            pyproject.toml
            uv.lock

      - name: Close extra auto-generated PRs
        if: steps.versions.outputs.update_needed == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python .github/scripts/cleanup_aioplaces_update_branches.py \
            --repository "$REPOSITORY" \
            --branch chore/update-aioplaces-manifest \
            --branch-prefix chore/update-aioplaces \
            --label-name dependencies \
            --keep-pr-number "$KEEP_PR_NUMBER" \
            --close-stale-prs \
            --delete-merged-branches

      - name: Log when no update is required
        if: steps.versions.outputs.update_needed != 'true'
        run: echo "aioplaces is already at the latest stable version; checking for stale update PRs."

      - name: Close stale aioplaces update PRs
        if: steps.versions.outputs.update_needed != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python .github/scripts/cleanup_aioplaces_update_branches.py \
            --repository "$REPOSITORY" \
            --branch chore/update-aioplaces-manifest \
            --branch-prefix chore/update-aioplaces \
            --label-name dependencies \
            --close-stale-prs \
            --delete-stale-branch \
            --delete-merged-branches
